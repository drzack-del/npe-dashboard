AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CadenceIQ AWS foundation (Stage 2, test): private network with no internet path for the
  database, and an account-wide audit trail kept for 6 years. Creates no compute and holds
  no patient data.

Parameters:
  Stage:
    Type: String
    Default: test
    AllowedValues: [test, prod]

Resources:
  # ── Network ───────────────────────────────────────────────────────────────
  # Public subnets hold only the load balancer and the data-layer containers (reachable
  # solely through the load balancer, enforced later by security groups). Private subnets
  # hold the database and have no route to or from the internet. No NAT gateway.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}' }]
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-public-a' }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-public-b' }]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-public' }]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-private-a' }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-private-b' }]
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-private-no-internet' }]
  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }
  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # ── Audit logs ────────────────────────────────────────────────────────────
  # Private, encrypted, versioned bucket for CloudTrail and network flow logs. HTTPS only.
  # Kept 6 years (HIPAA documentation retention); moved to cheaper storage after 90 days.
  AuditLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'cadenceiq-${Stage}-audit-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: retain-6-years
            Status: Enabled
            Transitions: [{ StorageClass: GLACIER_IR, TransitionInDays: 90 }]
            ExpirationInDays: 2190
            NoncurrentVersionExpiration: { NoncurrentDays: 2190 }

  AuditLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AuditLogBucket.Arn, !Sub '${AuditLogBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogBucket.Arn
            Condition: { StringEquals: { 'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/cadenceiq-${Stage}-audit' } }
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AuditLogBucket.Arn}/cloudtrail/AWSLogs/${AWS::AccountId}/*'
            Condition: { StringEquals: { 'aws:SourceArn': !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/cadenceiq-${Stage}-audit' } }
          - Sid: FlowLogsAclCheck
            Effect: Allow
            Principal: { Service: delivery.logs.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogBucket.Arn
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }
          - Sid: FlowLogsWrite
            Effect: Allow
            Principal: { Service: delivery.logs.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${AuditLogBucket.Arn}/flow-logs/AWSLogs/${AWS::AccountId}/*'
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }

  # Every management action in every region: who did what, when, from where. Log files are
  # signed so tampering is detectable.
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditLogBucketPolicy
    Properties:
      TrailName: !Sub 'cadenceiq-${Stage}-audit'
      S3BucketName: !Ref AuditLogBucket
      S3KeyPrefix: cloudtrail
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  # Record of every network connection attempt in and out of the private network.
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: AuditLogBucketPolicy
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: s3
      LogDestination: !Sub '${AuditLogBucket.Arn}/flow-logs'
      MaxAggregationInterval: 600

Outputs:
  VpcId: { Value: !Ref Vpc, Export: { Name: !Sub 'cadenceiq-${Stage}-vpc' } }
  PublicSubnets:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub 'cadenceiq-${Stage}-public-subnets' }
  PrivateSubnets:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub 'cadenceiq-${Stage}-private-subnets' }
  AuditLogBucket: { Value: !Ref AuditLogBucket }
