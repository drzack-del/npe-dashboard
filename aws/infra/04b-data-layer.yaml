AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CadenceIQ data layer (Stage 2, test): HTTPS load balancer -> PostgREST 14.1 (the same data
  layer Supabase runs) -> the private Aurora database. PostgREST accepts only access tokens
  signed by the CadenceIQ Cognito pool and switches to the database role in the token, so the
  database's row-level security decides what each request can see. A small nginx in front
  maps Supabase's /rest/v1/ paths so the app's data code runs unchanged.

Parameters:
  Stage:
    Type: String
    Default: test
    AllowedValues: [test, prod]
  JwksJson:
    Type: String
    Description: Public signing keys of the Cognito user pool (from its .well-known/jwks.json).
  AllowedOrigins:
    Type: String
    Default: 'http://localhost:5173,http://localhost:5174,http://localhost:5175'
    Description: Web addresses allowed to call the API from a browser (comma separated).
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 2]
    Description: Running copies of the data layer. 0 until the database password is set; 0 also pauses it between test sessions.
  PostgrestImage:
    Type: String
    Default: docker.io/postgrest/postgrest:v14.1
  ProxyImage:
    Type: String
    Default: docker.io/library/nginx:1.27-alpine

Resources:
  # Password for the data layer's database login, generated by AWS; nobody types or sees it.
  AuthenticatorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'cadenceiq-${Stage}/db-authenticator'
      Description: Database password for the PostgREST login role (authenticator)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"authenticator"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  # ── Network rules ─────────────────────────────────────────────────────────
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CadenceIQ API load balancer - HTTPS from the internet only
      VpcId: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-vpc' }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-alb' }]

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CadenceIQ data layer - reachable only from the load balancer
      VpcId: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-vpc' }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup, Description: From load balancer }
      Tags: [{ Key: Name, Value: !Sub 'cadenceiq-${Stage}-data-layer' }]

  # The database's single inbound rule: the data layer, on the Postgres port, nothing else.
  DatabaseIngressFromDataLayer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-db-sg' }
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ServiceSecurityGroup
      Description: From the CadenceIQ data layer only

  # ── Load balancer (HTTPS only, modern TLS) ────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'cadenceiq-${Stage}-api'
      Scheme: internet-facing
      Type: application
      Subnets: !Split [',', !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-public-subnets' }]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-vpc' }
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-api-certificate' } }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  # ── Data layer containers ─────────────────────────────────────────────────
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/cadenceiq-${Stage}-data-layer'
      RetentionInDays: 365

  # Lets ECS pull the images, write logs, and read only the data layer's database password.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-authenticator-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AuthenticatorSecret

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'cadenceiq-${Stage}'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'cadenceiq-${Stage}-data-layer'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: postgrest
          Image: !Ref PostgrestImage
          Essential: true
          Environment:
            - Name: PGRST_DB_URI
              Value: !Sub
                - 'postgres://authenticator@${Endpoint}:5432/cadenceiq?sslmode=require'
                - Endpoint: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-db-endpoint' }
            - { Name: PGRST_DB_SCHEMAS, Value: public }
            - { Name: PGRST_DB_ANON_ROLE, Value: anon }
            - { Name: PGRST_JWT_SECRET, Value: !Ref JwksJson }
            - { Name: PGRST_DB_MAX_ROWS, Value: '1000' }
            - { Name: PGRST_DB_POOL, Value: '5' }
            - { Name: PGRST_OPENAPI_MODE, Value: disabled }
            - { Name: PGRST_LOG_LEVEL, Value: warn }
            - { Name: PGRST_SERVER_PORT, Value: '3000' }
            - { Name: PGRST_ADMIN_SERVER_PORT, Value: '3001' }
            - { Name: PGRST_SERVER_CORS_ALLOWED_ORIGINS, Value: !Ref AllowedOrigins }
          Secrets:
            - { Name: PGPASSWORD, ValueFrom: !Sub '${AuthenticatorSecret}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: postgrest }
        # Maps /rest/v1/* to PostgREST (Supabase's URL layout) and exposes PostgREST's readiness
        # check at /health. Access logging is off so request URLs are never written to logs.
        - Name: proxy
          Image: !Ref ProxyImage
          Essential: true
          DependsOn: [{ ContainerName: postgrest, Condition: START }]
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - Name: NGINX_CONF
              Value: |
                server {
                  listen 8080;
                  server_tokens off;
                  access_log off;
                  client_max_body_size 5m;
                  location = /health { proxy_pass http://127.0.0.1:3001/ready; }
                  location /rest/v1/ {
                    proxy_pass http://127.0.0.1:3000/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                  }
                  location / { return 404; }
                }
          EntryPoint: [/bin/sh, -c]
          Command: ["printf '%s' \"$NGINX_CONF\" > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: proxy }

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, DatabaseIngressFromDataLayer]
    Properties:
      ServiceName: data-layer
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-public-subnets' }]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers: [{ ContainerName: proxy, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }]

Outputs:
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  AuthenticatorSecretArn:
    Value: !Ref AuthenticatorSecret
  ClusterName:
    Value: !Ref Cluster
