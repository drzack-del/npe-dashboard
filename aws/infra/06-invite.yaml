AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CadenceIQ invite-user function (Stage 2, test) behind the API load balancer at
  /functions/v1/invite-user. A practice admin who has added someone to the team list calls it
  to create that person's login and have Cognito email them a one-time password (or resend it),
  or to reset a team member's two-step sign-in when they lose their phone.
  Code: aws/functions/invite-user, loaded from the function-code bucket.

Parameters:
  Stage:
    Type: String
    Default: test
    AllowedValues: [test, prod]
  JwksJson:
    Type: String
    Description: Public signing keys of the Cognito user pool.
  ListenerArn:
    Type: String
    Description: HTTPS listener of the API load balancer (from cadenceiq-<stage>-data-layer).
  CodeKey:
    Type: String
    Default: invite-user/invite-user.zip
  CodeVersion:
    Type: String
    Description: S3 version of the uploaded code zip (pins exactly which code runs).
  ApiBase:
    Type: String
    Default: https://api-test.trycadenceiq.com/rest/v1
  AllowedOrigins:
    Type: String
    Default: 'http://localhost:5173,http://localhost:5174,http://localhost:5175'

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: invite-to-user-pool
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminGetUser, cognito-idp:AdminSetUserMFAPreference, cognito-idp:AdminUserGlobalSignOut]
                Resource: !Sub
                  - 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PoolId}'
                  - PoolId: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-user-pool-id' }

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/cadenceiq-${Stage}-invite-user'
      RetentionInDays: 365

  Function:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Sub 'cadenceiq-${Stage}-invite-user'
      Description: Creates logins for people practice admins added to the team (code in aws/functions/invite-user)
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWKS: !Ref JwksJson
          ISSUER: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-token-issuer' }
          CLIENT_ID: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-web-client-id' }
          USER_POOL_ID: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-user-pool-id' }
          API_BASE: !Ref ApiBase
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Code:
        S3Bucket: !ImportValue { 'Fn::Sub': 'cadenceiq-${Stage}-function-code-bucket' }
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeVersion

  LoadBalancerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: LoadBalancerInvokePermission
    Properties:
      TargetType: lambda
      Targets: [{ Id: !GetAtt Function.Arn }]

  # Only this exact path reaches the function; everything else still goes to the data layer.
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: 20
      Conditions: [{ Field: path-pattern, PathPatternConfig: { Values: [/functions/v1/invite-user] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

Outputs:
  FunctionName:
    Value: !Ref Function
